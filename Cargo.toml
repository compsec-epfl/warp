[package]
name = "warp"
version = "0.0.1"
include = ["Cargo.toml", "src", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
edition = "2021"

[dependencies]
ark-crypto-primitives = { version = "0.5.0", features = [
    "crh",
    "constraints",
    "sponge",
] }
ark-ff = "0.5.0"
ark-poly = "0.5.0"
ark-r1cs-std = "0.5.0"
ark-relations = "0.5.0"
ark-serialize = "0.5.0"
ark-std = "0.5.0"
blake3 = "1.5.0"
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0"
spongefish = { git = "https://github.com/z-tech/spongefish.git", branch = "smallfp-support", features = [
    "ark-ff",
] }
efficient-sumcheck = { git = "https://github.com/compsec-epfl/efficient-sumcheck.git", branch = "z-tech/simd_goldilocks_experimental" }
thiserror = "2.0.16"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "json", "registry"], optional = true }
libc = { version = "0.2", optional = true }
ark-codes = { git = "https://github.com/dmpierre/ark-codes.git" }
# Vector commitments. Replaces ark-crypto-primitives::merkle_tree in the
# warp prover/verifier. Uses the `blake3-field` flavor where leaves are
# slices of field elements (matches PESAT's interleaved-codeword shape).
ark-vc = { git = "https://github.com/arkworks-rs/ark-vc.git", default-features = false, features = ["std", "blake3", "blake3-field"] }


[patch.crates-io]
ark-crypto-primitives = { git = "https://github.com/arkworks-rs/crypto-primitives.git", branch = "z-tech/smallfp-absorb" }
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git", rev = "285dac2" }
ark-poly = { git = "https://github.com/arkworks-rs/algebra.git", rev = "285dac2" }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra.git", rev = "285dac2" }
ark-r1cs-std = { git = "https://github.com/arkworks-rs/r1cs-std" }
ark-relations = { git = "https://github.com/arkworks-rs/snark.git" }
ark-snark = { git = "https://github.com/arkworks-rs/snark.git" }

# resolve transitive pull of spongefish from efficient-sumcheck
[patch."https://github.com/arkworks-rs/spongefish"]
spongefish = { git = "https://github.com/z-tech/spongefish.git", branch = "smallfp-support" }

[dev-dependencies]
ark-bls12-381 = "0.5.0"
ark-bn254 = "0.5.0"
criterion = "0.8"
# Deterministic instruction-count benches. Requires valgrind + the
# `iai-callgrind-runner` binary at runtime (see benches/README.md).
# Unused on macOS except via Docker — `cargo build --bench iai_phases`
# still works everywhere, only `cargo bench` fails without valgrind.
iai-callgrind = "0.14"

[features]
default = ["asm"]

asm = ["ark-ff/asm"]

# Opt-in profiling: brings in tracing-subscriber + libc so we can emit
# structured per-phase records (wall_ns, cpu_ns, peak_rss_delta, op counters).
# Release builds with `profile` off pull in neither tracing-subscriber nor
# libc as direct deps of `warp`.
profile = ["dep:tracing-subscriber", "dep:libc"]

[[bench]]
name = "warp_rs"
harness = false

# iai-callgrind: deterministic instruction counts per prove phase. Runs
# under valgrind; use `make bench-ci-local` on macOS to run inside Docker.
[[bench]]
name = "iai_phases"
harness = false
