[package]
name = "warp"
version = "0.0.1"
include = ["Cargo.toml", "src", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
edition = "2021"

[dependencies]
ark-crypto-primitives = { version = "0.6.0", features = [
    "merkle_tree",
    "crh",
    "constraints",
    "sponge",
    "blake3",
] }
ark-ff = "0.6.0"
ark-poly = "0.6.0"
ark-r1cs-std = "0.6.0"
ark-relations = "0.6.0"
ark-serialize = "0.6.0"
ark-std = "0.6.0"
blake3 = "1.5.0"
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0"
spongefish = { version = "0.7.0", features = ["ark-ff"] }
effsc = { git = "https://github.com/compsec-epfl/efficient-sumcheck.git" }
thiserror = "2.0.16"
ark-codes = { git = "https://github.com/z-tech/ark-codes.git", branch = "z-tech/arkworks-0.6.0" }

[dev-dependencies]
ark-bls12-381 = "0.6.0"
ark-bn254 = "0.6.0"
criterion = "0.8"

[features]
default = ["asm"]

asm = ["ark-ff/asm"]

[[bench]]
name = "warp_rs"
harness = false
