name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches-ignore: []

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Load ark-vc deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ARK_VC_DEPLOY_KEY }}

      - name: Rewrite ark-vc HTTPS URL to SSH
        run: git config --global url."ssh://git@github.com/arkworks-rs/ark-vc.git".insteadOf "https://github.com/arkworks-rs/ark-vc.git"

      - name: Install stable toolchain with clippy
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy
          override: true

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check for clippy fixes
        run: |
          cargo clippy --fix --allow-dirty --allow-staged || true
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "❌ Clippy would make changes. Please run 'cargo clippy --fix'."
            git diff
            exit 1
          fi

  test_with_default_features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Load ark-vc deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ARK_VC_DEPLOY_KEY }}

      - name: Rewrite ark-vc HTTPS URL to SSH
        run: git config --global url."ssh://git@github.com/arkworks-rs/ark-vc.git".insteadOf "https://github.com/arkworks-rs/ark-vc.git"

      - name: Run tests
        run: cargo test --verbose

  test_with_no_default_features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Load ark-vc deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ARK_VC_DEPLOY_KEY }}

      - name: Rewrite ark-vc HTTPS URL to SSH
        run: git config --global url."ssh://git@github.com/arkworks-rs/ark-vc.git".insteadOf "https://github.com/arkworks-rs/ark-vc.git"

      - name: Run tests
        run: cargo test --verbose --no-default-features
